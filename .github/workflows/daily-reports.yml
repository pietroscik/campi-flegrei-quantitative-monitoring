name: Daily Reports

on:
  schedule:
    # Ogni giorno alle 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Branch su cui committare i report rigenerati. Se main e' protetto,
  # cambiare qui con un branch dedicato (es. automation/daily-reports).
  TARGET_BRANCH: main

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data/processed data/raw

      # Scarica il catalogo INGV fino a oggi e rigenera tutte le analisi
      - name: Run pipeline (fresh INGV data)
        run: python run_pipeline.py

      - name: Regenerate reports and figures
        run: |
          python scripts/generate_paper_figures.py
          python scripts/generate_summary_figure.py
          python scripts/generate_report.py

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports figures results
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento nei report da committare"
          else
            git commit -m "chore: auto-regenera report e figure [skip ci]"
            git push origin ${{ env.TARGET_BRANCH }}
          fi
